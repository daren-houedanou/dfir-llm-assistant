[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dfir-llm-assistant"
version = "0.1.0"
description = "LLM-assisted triage, correlation and query generation for DFIR artifacts produced by nix-forensics tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Daren Houedanou" }]
keywords = ["dfir", "forensics", "llm", "litellm", "incident-response", "nix"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
dev = ["pytest>=8", "ruff>=0.6", "textual>=0.80", "pytest-asyncio>=0.23"]

[project.scripts]
dfa = "dfirassist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dfirassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long strings and comments; layout is handled by `ruff format`
