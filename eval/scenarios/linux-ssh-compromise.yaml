name: linux-ssh-compromise
description: >
  Attaque SSH par mot de passe sur un serveur web, compte valide « deploy » compromis, sudo vers
  root, utilisateur porte dérobée d'UID 0, charge téléchargée dans /tmp, reverse shell dans la
  crontab de root, fichier journal détruit avec shred.
artifacts:
  - ../../samples/linux-ssh-compromise
expected:
  verdict: malicious
  techniques: [T1110.001, T1078, T1021.004, T1548.003, T1136.001, T1098, T1105, T1053.003, T1059.004, T1070.002]
  iocs: [198.51.100.23, deploy, sysupdate, 203.0.113.99, /tmp/.kworkerd]
questions:
  - q: Which account was compromised by the attacker?
    expect_any: [deploy]
  - q: What is the IP address of the reverse shell destination?
    expect_any: [203.0.113.99]
