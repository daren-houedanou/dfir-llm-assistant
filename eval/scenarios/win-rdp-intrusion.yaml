name: win-rdp-intrusion
description: >
  External RDP brute force on a finance workstation, successful logon as the local
  administrator, discovery commands (whoami, net, nltest), backdoor account added to Administrators, encoded PowerShell download
  cradle installed as a service, then Security log cleared.
artifacts:
  - ../../samples/win-rdp-intrusion
expected:
  verdict: malicious
  techniques: [T1110.001, T1078, T1021.001, T1033, T1087, T1482, T1136.001, T1098, T1059.001, T1027, T1105, T1543.003, T1070.001]
  iocs: [203.0.113.45, svc_backup, WinUpdateHelper, 198.51.100.77]
questions:
  - q: Which account did the attacker use for the first successful logon?
    expect_any: [administrator]
  - q: What persistence mechanisms were installed?
    expect_any: [WinUpdateHelper, svc_backup]
