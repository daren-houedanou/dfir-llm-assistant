# Pile locale pour le développement et les démonstrations :  docker compose -f deploy/docker-compose.yml up -d
#
#   ollama-pull   tâche ponctuelle : son propre serveur Ollama temporaire, avec accès à Internet, télécharge
#                 les modèles dans le volume partagé, puis s'arrête
#   ollama        modèles hébergés en local (GPU facultatif), démarré après le téléchargement, sans accès à Internet
#   litellm       passerelle compatible OpenAI sur http://localhost:4000
#
# Profil : LITELLM_CONFIG=config.local-only.yaml pour une passerelle strictement locale.

name: dfir-llm

services:
  ollama:
    image: ollama/ollama:0.12.6
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    environment:
      # Le contexte par défaut d'Ollama est de 4096 tokens, ce qui tronque les prompts de dfa (environ 6000 tokens par défaut).
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
    volumes:
      - ollama:/root/.ollama
    networks: [internal]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30
    # À décommenter sur une machine avec un GPU NVIDIA et le NVIDIA Container Toolkit :
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:
    # C'est le *serveur* Ollama qui télécharge : il faut donc un serveur qui accède à Internet.
    # En lancer un séparé et temporaire permet de garder hors ligne celui qui sert les modèles.
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    environment:
      MODELS: ${DFA_PULL_MODELS:-qwen2.5:7b-instruct llama3.2:3b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve & sleep 3
        for m in $$MODELS; do ollama pull "$$m" || exit 1; done
    networks: [egress]
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/etc/litellm/${LITELLM_CONFIG:-config.yaml}", "--port", "4000"]
    environment:
      OLLAMA_API_BASE: http://ollama:11434
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in deploy/.env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - ./litellm:/etc/litellm:ro
    ports:
      - "127.0.0.1:4000:4000"   # boucle locale uniquement : la passerelle n'est pas exposée sur le réseau
    depends_on:
      ollama: { condition: service_healthy }
    networks: [internal, egress]

volumes:
  ollama:

networks:
  internal:
    internal: true   # ollama n'a aucune route vers Internet
  egress: {}
