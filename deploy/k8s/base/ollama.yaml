apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels: { app.kubernetes.io/name: ollama }
spec:
  replicas: 1
  strategy: { type: Recreate }   # volume RWO
  selector:
    matchLabels: { app.kubernetes.io/name: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ollama
          image: ollama/ollama:0.12.6
          env:
            - { name: HOME, value: /models }
            - { name: OLLAMA_MODELS, value: /models/.ollama/models }
            - { name: OLLAMA_KEEP_ALIVE, value: 30m }
          ports:
            - { name: http, containerPort: 11434 }
          readinessProbe:
            httpGet: { path: /api/version, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: "2", memory: 8Gi }
            limits: { memory: 16Gi }
            # Sur des nœuds GPU (NVIDIA device plugin) :
            # limits: { nvidia.com/gpu: 1 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: models, mountPath: /models }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: { app.kubernetes.io/name: ollama }
  ports:
    - { name: http, port: 11434, targetPort: http }
---
# Téléchargement ponctuel des modèles. Dans un cluster air-gapped, pré-charger plutôt le PVC
# (depuis un registre interne ou un artefact OCI, par exemple) et supprimer ce Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-models
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama-pull, dfir-ai/egress: model-registry }
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pull
          image: ollama/ollama:0.12.6
          env:
            - { name: OLLAMA_HOST, value: "http://ollama:11434" }
            - { name: HOME, value: /tmp }
          command: ["/bin/sh", "-c", "ollama pull qwen2.5:7b-instruct && ollama pull llama3.2:3b"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
