# Base = profil air-gapped : modèles locaux uniquement, aucune sortie depuis la passerelle.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dfir-ai
labels:
  - pairs: { app.kubernetes.io/part-of: dfir-llm-assistant }
resources:
  - namespace.yaml
  - ollama.yaml
  - litellm.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml=litellm-config.yaml  # copie de deploy/litellm/config.local-only.yaml, synchronisation vérifiée par les tests
