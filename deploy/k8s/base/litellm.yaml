apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels: { app.kubernetes.io/name: litellm }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: litellm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: litellm }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable   # pin a digest for production
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "2"]
          env:
            - { name: OLLAMA_API_BASE, value: "http://ollama:11434" }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: master-key } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: anthropic-api-key, optional: true } }
            - name: MISTRAL_API_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: mistral-api-key, optional: true } }
          ports:
            - { name: http, containerPort: 4000 }
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/litellm, readOnly: true }
      volumes:
        - name: config
          configMap: { name: litellm-config }
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
spec:
  selector: { app.kubernetes.io/name: litellm }
  ports:
    - { name: http, port: 4000, targetPort: http }
