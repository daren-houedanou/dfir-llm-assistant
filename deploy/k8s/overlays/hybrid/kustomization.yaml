# Profil hybride : ajoute les alias cloud (utilisés seulement avec --cloud, après pseudonymisation)
# et ouvre la sortie HTTPS pour les pods de la passerelle uniquement.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - egress-cloud.yaml
configMapGenerator:
  - name: litellm-config
    behavior: replace
    files:
      - config.yaml=litellm-config.yaml  # copie de deploy/litellm/config.yaml, synchronisation vérifiée par les tests
