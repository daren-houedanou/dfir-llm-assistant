# Configuration de la passerelle LiteLLM (profil hybride : local + cloud).
#
# Les alias de modèles forment le contrat avec le client :
#   dfir-local*  -> modèles hébergés en local (Ollama). Autorisés pour les dossiers confidentiels.
#   dfir-cloud   -> fournisseurs externes. Le client ne l'utilise qu'avec --cloud, après pseudonymisation.
# Le client garde la liste des alias locaux dans DFA_LOCAL_MODELS ; la passerelle applique la
# même séparation avec des clés virtuelles par équipe (voir docs/CONCEPTION.md, « Confidentialité »).
#
# Les déploiements air-gapped utilisent config.local-only.yaml à la place (aucun alias cloud).

model_list:
  # --- local, confidentiel ------------------------------------------------------
  - model_name: dfir-local
    litellm_params:
      model: ollama_chat/qwen2.5:7b-instruct
      api_base: os.environ/OLLAMA_API_BASE
      keep_alive: 30m
    model_info:
      dfir_policy: local

  - model_name: dfir-local-small        # repli quand le modèle local principal est occupé ou absent
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: os.environ/OLLAMA_API_BASE
    model_info:
      dfir_policy: local

  # --- cloud, uniquement après pseudonymisation -----------------------------------
  - model_name: dfir-cloud
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      dfir_policy: cloud

  - model_name: dfir-cloud-eu           # alternative hébergée dans l'UE
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY
    model_info:
      dfir_policy: cloud

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 300
  # Les replis ne franchissent jamais la frontière de confidentialité : un modèle local ne se replie que sur un modèle local.
  fallbacks:
    - dfir-local: [dfir-local-small]
    - dfir-cloud: [dfir-cloud-eu]

litellm_settings:
  drop_params: true          # par exemple response_format sur les modèles qui ne le gèrent pas
  request_timeout: 300
  # Ne transmettre les prompts (données d'enquête) à aucun outil de journalisation ou d'observabilité.
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
